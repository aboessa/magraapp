<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Majarra Flow Automator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #06091A;
            color: #F1F5F9;
            font-family: 'Tajawal', 'Segoe UI', sans-serif;
            padding: 14px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            gap: 0;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 12px;
        }
        .header-icon { font-size: 20px; }
        .header-title { font-weight: 800; font-size: 14px; color: #00D6F5; }
        .header-sub { font-size: 10px; color: #94A3B8; }

        .status-dot {
            height: 10px; width: 10px;
            background-color: #EF4444;
            border-radius: 50%;
            display: inline-block;
            margin-right: auto;
            transition: background 0.3s;
        }
        .status-dot.connected { background-color: #22C55E; box-shadow: 0 0 8px rgba(34,197,94,0.5); }

        .btn-load {
            width: 100%;
            background: linear-gradient(135deg, #6A3DF2, #2856D8);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 9px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            margin-bottom: 6px;
            box-shadow: 0 4px 12px rgba(106,61,242,0.3);
            transition: opacity 0.2s;
        }
        .btn-load:hover { opacity: 0.85; }
        .btn-load.secondary {
            background: linear-gradient(135deg, #0E7490, #00D6F5);
            margin-bottom: 10px;
        }

        .queue-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #94A3B8;
            margin-bottom: 5px;
            gap: 8px;
        }
        .queue-count { color: #00D6F5; font-weight: bold; white-space: nowrap; }

        /* Start-from row */
        .start-from-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #94A3B8;
            margin-bottom: 8px;
            background: rgba(0,214,245,0.05);
            border: 1px solid rgba(0,214,245,0.12);
            border-radius: 6px;
            padding: 6px 10px;
        }
        .start-from-row label { flex: 1; }
        .start-from-row input[type="number"] {
            width: 65px;
            background: #111736;
            border: 1px solid rgba(0,214,245,0.3);
            border-radius: 5px;
            color: #00D6F5;
            padding: 4px 6px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            font-family: inherit;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: #0B1026;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            color: #FFD34D;
            padding: 8px;
            font-size: 10px;
            font-family: 'Consolas', monospace;
            resize: vertical;
            outline: none;
            direction: ltr;
            text-align: left;
            margin-bottom: 10px;
        }
        textarea:focus { border-color: #00D6F5; }

        .settings {
            background: #0B1026;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 7px;
            font-size: 11px;
        }
        .setting-row:last-child { margin-bottom: 0; }
        .setting-row label { color: #94A3B8; }

        select, input[type="number"] {
            background: #111736;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 5px;
            color: #fff;
            padding: 4px 7px;
            font-size: 11px;
            font-family: inherit;
        }
        input[type="checkbox"] { accent-color: #00D6F5; width: 16px; height: 16px; }

        /* Action buttons */
        .actions {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        .btn-start {
            flex: 2;
            background: linear-gradient(135deg, #00D6F5, #2856D8);
            color: #06091A;
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 15px rgba(0,214,245,0.3);
            transition: opacity 0.2s;
        }
        .btn-start:hover { opacity: 0.88; }

        .btn-pause {
            flex: 1;
            background: #F59E0B;
            color: #06091A;
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            display: none;
            transition: opacity 0.2s;
        }
        .btn-pause:hover { opacity: 0.88; }
        .btn-pause.resumed {
            background: #22C55E;
        }

        .btn-stop {
            flex: 1;
            background: #EF4444;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            display: none;
        }
        .btn-stop:hover { opacity: 0.88; }

        /* Status badge */
        .status-badge {
            text-align: center;
            font-size: 11px;
            color: #94A3B8;
            margin-bottom: 6px;
            min-height: 16px;
        }
        .status-badge.running { color: #00D6F5; }
        .status-badge.paused  { color: #F59E0B; font-weight: bold; }
        .status-badge.done    { color: #22C55E; font-weight: bold; }

        .progress-container {
            width: 100%;
            background: #1E293B;
            border-radius: 5px;
            margin-bottom: 8px;
            overflow: hidden;
            height: 7px;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00D6F5, #6A3DF2);
            transition: width 0.4s ease;
            border-radius: 5px;
        }

        .log {
            flex-grow: 1;
            background: #040612;
            border: 1px solid rgba(0,214,245,0.15);
            border-radius: 8px;
            padding: 8px;
            font-family: 'Consolas', monospace;
            font-size: 10px;
            color: #4ADE80;
            overflow-y: auto;
            direction: ltr;
            text-align: left;
            min-height: 60px;
        }
        .log div { margin-bottom: 2px; padding: 1px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .log div.warn  { color: #F59E0B; }
        .log div.error { color: #EF4444; }
        .log div.info  { color: #00D6F5; }
        .log div.ok    { color: #4ADE80; }
    </style>
</head>
<body>
    <div class="header">
        <span class="header-icon">🚀</span>
        <div>
            <div class="header-title">مجرة Flow Automator <span style="font-size:10px; color:#94A3B8;">v4.2</span></div>
            <div class="header-sub">أتمتة توليد صور مجرة عبر API المباشر 🎯</div>
        </div>
        <span class="status-dot" id="statusDot" title="حالة الاتصال"></span>
    </div>

    <button class="btn-load" id="loadPromptsBtn">📂 تحميل كنز برومبتات مجرة (209 برومبت)</button>
    <button class="btn-load secondary" id="uploadFileBtn">📄 رفع ملف برومبتات (IMAGE_PROMPTS.txt)</button>
    <input type="file" id="fileInput" accept=".txt,.csv,.md" style="display: none;">

    <div class="queue-row">
        <span>البرومبتات المحمّلة:</span>
        <span class="queue-count" id="queueCount">0 برومبت</span>
    </div>

    <!-- Start From Row -->
    <div class="start-from-row">
        <label>▶ ابدأ من البرومبت رقم:</label>
        <input type="number" id="startFromInput" value="1" min="1" max="9999">
        <span id="startFromHint" style="color:#64748B; font-size:10px;">من 0</span>
    </div>

    <textarea id="promptsInput" placeholder="أدخل البرومبتات هنا (سطر لكل برومبت)...&#10;Format: Prompt text | filepath | size(ratio)"></textarea>

    <div class="settings">
        <div class="setting-row">
            <label>المهلة بين كل عملية (ثواني):</label>
            <input type="number" id="delayInput" value="12" min="5" max="120">
        </div>
        <div class="setting-row">
            <label>نسبة الأبعاد:</label>
            <select id="ratioSelect">
                <option value="auto">🎯 تلقائي من البرومبت</option>
                <option value="16:9">16:9 (عريض / Hero)</option>
                <option value="4:3">4:3 (شخصيات / مشاهد)</option>
                <option value="1:1">1:1 (أغلفة عوالم)</option>
                <option value="3:4">3:4 (بوسترات)</option>
                <option value="9:16">9:16 (موبايل)</option>
            </select>
        </div>
        <div class="setting-row">
            <label>الموديل:</label>
            <select id="modelSelect">
                <option value="nano2">Nano Banana 2</option>
                <option value="nanoPro">Nano Banana Pro</option>
            </select>
        </div>
        <div class="setting-row">
            <label>تحميل تلقائي للصور:</label>
            <input type="checkbox" id="autoDownload" checked>
        </div>
    </div>

    <!-- Status Badge -->
    <div class="status-badge" id="statusBadge">جاهز</div>

    <div class="actions">
        <button class="btn-start" id="startBtn">▶️ بدء الأتمتة</button>
        <button class="btn-pause" id="pauseBtn">⏸ إيقاف مؤقت</button>
        <button class="btn-stop"  id="stopBtn">⏹ إيقاف كامل</button>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="log" id="logArea">
        <div class="info">👋 جاهز للبدء! حمّل البرومبتات ثم اضغط بدء الأتمتة.</div>
    </div>

    <script src="IMAGE_PROMPTS_PRESET.js"></script>
    <script src="sidepanel.js"></script>
</body>
</html>
