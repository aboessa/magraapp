هدف 10,000 أسرة مدفوعة ليس صغيرًا، لكنه قابل للتحقيق عبر عدة دول وشراكات مدارس ومساجد ومؤثرين، بشرط أن تكون الاحتفاظات جيدة.

6. هل توجد فرصة فعلًا؟
نعم، للأسباب التالية
1. السوق كبير ومتنامٍ

التعليم الرقمي، تطبيقات الأطفال والبث كلها أسواق متنامية، والاشتراكات أصبحت سلوكًا معتادًا لدى الأسر. الطلب العالمي على محتوى الأطفال نفسه ارتفع؛ Parrot Analytics رصد نموًا في الطلب على محتوى ما قبل المدرسة بنحو 25%، ومحتوى سن المدرسة بنحو 21%.

2. الجمهور المسلم أصغر عمرًا وينمو

بلغ عدد المسلمين عالميًا نحو ملياري شخص في 2020، وكان الإسلام أسرع الأديان الكبرى نموًا بين 2010 و2020. كما أن وسيط عمر المسلمين عالميًا كان 24 عامًا مقابل 33 لغير المسلمين، ما يدعم استمرار نمو سوق الأطفال والعائلات.

3. هناك فجوة بين التعليم العام والمحتوى الإسلامي

المنصات الكبيرة تقدم تعليمًا عامًا وترفيهًا عالميًا. والمنصات الإسلامية تقدم إسلاميات وقصصًا دينية. الفرصة هي بناء منتج يجمع الاثنين دون أن يبدو كأنه «تطبيق دروس دينية فقط».

4. الآباء يبحثون عن Screen Time أفضل

المشكلة ليست أن الأطفال لا يستخدمون الشاشات، بل أن الآباء يريدون تحويل جزء من هذا الوقت إلى محتوى آمن ونافع. وجود رقابة أبوية، تقارير، عدم وجود إعلانات ومسارات تعلم يزيد القيمة المدركة.

5. المحتوى العربي الجيد أقل تشبعًا من الإنجليزي

المنافسة الإنجليزية عالية جدًا. أما إنتاج عربي بجودة عالمية، مع دبلجة إنجليزية وفرنسية وربط ثقافي وإسلامي، فما زال أقل توفرًا.

7. ما المميز في «مجرة» تحديدًا؟

الخطة الحالية لا تقدم مجرد تطبيق فيديو. هي تبني منصة محتوى متعددة الملكيات الفكرية.

الميزة الأولى: الجمع بين سوقين

أقوى نقطة تجارية لديك:

تعليم وترفيه عام لكل طفل عربي، مع عالم إسلامي اختياري ومتكامل.

بهذا لا تحصر نفسك في جمهور ديني فقط، وفي الوقت نفسه تمنح الأسرة المسلمة سببًا قويًا لاختيارك بدل Lingokids أو YouTube Kids.

الميزة الثانية: ليست هناك شخصية واحدة تحبس العلامة

اتفقنا أن الشخصيات تكون ثابتة داخل السلسلة فقط، وليس في المنصة كلها.

هذا يمنحك:

سلاسل مختلفة لأعمار مختلفة.
إمكانية اختبار عدة أنواع من الشخصيات.
عدم سقوط المنصة إذا لم تنجح شخصية واحدة.
امتلاك عدة IPs قابلة للترخيص.
إمكانية شراء أو ترخيص محتوى من منتجين آخرين.
إنتاج مواسم للسلسلة الناجحة وإيقاف غير الناجحة.

هذه ميزة استراتيجية أقوى من مجرد تصميم جميل.

الميزة الثالثة: منظومة محتوى كاملة

مجرة تجمع:

كرتون.
فيديو تعليمي.
قصص مصورة.
كوميكس.
قصص صوتية.
قراءة تلقائية.
ألعاب.
اختبارات.
صور تفاعلية.
أنشطة منزلية.
محتوى Offline.

معظم المنافسين يتموضعون أساسًا حول فيديو، كتب أو ألعاب؛ مجرة ستربط الأنواع داخل رحلة واحدة:

شاهد القصة → اقرأ الكوميكس → استمع للصوت → العب → أجب → احصل على شارة.

هذا يدعم الاحتفاظ أكثر من مكتبة فيديو فقط.

الميزة الرابعة: الكواكب كنظام اكتشاف

الكواكب ليست مجرد شكل بصري، بل يمكن أن تتحول إلى نظام واضح:

كوكب اللغة.
كوكب العلوم.
كوكب الأرقام.
كوكب القصص.
كوكب القيم.
كوكب الإبداع.
الكوكب الإسلامي.

هذا يسهل على الطفل فهم التطبيق، ويمنحك مساحة تسويقية وإنتاجية مستمرة.

الميزة الخامسة: تصميم خاص بالمسلمين خارج البلاد

النسخة الدولية لا تكون مجرد ترجمة:

الإنجليزية أو الفرنسية هي لغة الواجهة.
العربية تظهر كلغة تعلم وهوية.
المفهوم الإسلامي يشرح بلغة الطفل الأساسية.
القصص تتناول المدرسة، الصداقة، رمضان والعيد في مجتمع غير مسلم.
يمكن توفير وضع ثنائي اللغة في الصفحة نفسها.
الصوت والنص قابلان للتبديل مستقلًا.

هذه نقطة يصعب على تطبيق عربي محلي أو تطبيق إسلامي بسيط تنفيذها جيدًا.

الميزة السادسة: قيمة واضحة لولي الأمر

ليس المطلوب أن يحب الطفل التطبيق فقط. من يدفع هو الأب أو الأم.

القيمة للوالد:

دون إعلانات.
محتوى منتقى.
تحكم في وقت الشاشة.
تقارير تعلم.
ملفات متعددة للأطفال.
اختيار العوالم المسموحة.
Offline.
حذف البيانات.
عدم وجود دردشة أو روابط خارجية.
الميزة السابعة: سعر محلي

بدل بيع التطبيق بـ9 دولارات في جميع الدول:

مصر بسعر محلي.
الخليج بسعر أعلى.
أوروبا وأمريكا بسعر دولي.
باقة مؤسسين.
اشتراك مدارس ومساجد.

هذا يزيد التحويل ويمنع أن يصبح السعر مستحيلًا في شمال أفريقيا وآسيا.

الميزة الثامنة: قابلية البيع للمؤسسات

يمكن توسعة مجرة إلى:

مدارس.
حضانات.
مدارس نهاية الأسبوع الإسلامية.
مساجد ومراكز مجتمعية.
مكتبات.
شركات اتصالات.
بنوك تقدم اشتراكًا للعائلات.
شركات طيران وفنادق عائلية.

B2B يمكن أن يقلل اعتمادك على إعلانات اكتساب المستخدمين باهظة التكلفة.

8. ما ليس ميزة تنافسية حقيقية؟

بعض الأشياء مهمة، لكنها لن تجعل العميل يختارك وحدها:

استخدام Flutter.
استخدام Cloudflare R2.
تشفير Offline.
شكل الفضاء.
اسم «مجرة».
استخدام الذكاء الاصطناعي.
وجود تطبيق Android وiOS.

هذه أدوات تنفيذ.

الميزة الحقيقية ستكون:

جودة المحتوى + الثقة + التحديث المستمر + اللغة والثقافة + تجربة الطفل + نتائج التعلم.

9. المخاطر الحقيقية
أكبر خطر: المحتوى الضعيف أو القليل

لو أطلقت بـ10 فيديوهات و5 قصص وكتبت «Netflix للأطفال»، سيشترك المستخدم شهرًا ثم يغادر.

تحتاج عند الإطلاق التجاري إلى مكتبة تشعر الأسرة أنها تستحق الاشتراك، مثل:

4–6 سلاسل قوية.
30–50 فيديو على الأقل.
30–50 قصة وكوميكس.
ألعاب متعددة المستويات.
تحديث أسبوعي واضح.
تقويم محتوى لستة أشهر.
المنافس المجاني

أكبر منافس ليس Miraj أو Lingokids؛ بل YouTube وYouTube Kids والمحتوى المجاني.

لن تنتصر بكمية الفيديو، بل بـ:

الثقة.
عدم الإعلانات.
عدم العشوائية.
المسار التعليمي.
الهوية.
التقارير.
Offline.
جودة الكتابة.
تكلفة الإنتاج

تطوير التطبيق يمكن التحكم فيه، لكن إنتاج الكرتون والقصص والصوت والترجمة بصورة مستمرة هو التكلفة الأساسية.

الفئة العمرية الواسعة

تجربة طفل 3 سنوات مختلفة جذريًا عن طفل 12 سنة. البداية الصحيحة هي 6–8 سنوات، ثم التوسع.

المحتوى الإسلامي

يحتاج:

لجنة شرعية.
مراجع لغوي.
سياسة واضحة للاختلافات الفقهية.
توثيق المصادر.
مراجعة تمثيل الأنبياء والصحابة والمقدسات.
تحديد سياسة الموسيقى والتصوير بما يتوافق مع تموضعك.
10. حكمي التجاري الصريح

الفرصة موجودة وقوية، لكنها ليست فرصة تطبيق بسيط ينجح بمجرد رفع محتوى.

مجرة يمكن أن تصبح مشروعًا ناجحًا إذا بنيتها كالتالي:

تبدأ بعمر 6–8.
تطلق بالعربية والإنجليزية.
تركز أولًا على السعودية، مصر، بريطانيا وكندا.
تمتلك 4 سلاسل أصلية مختلفة.
يكون العالم الإسلامي جزءًا قويًا وليس التطبيق كله.
تضيف محتوى جديدًا أسبوعيًا.
تسوق من خلال المدارس والمساجد ومؤثري التربية.
تقيس الاحتفاظ، لا عدد التنزيلات فقط.

أما إذا أصبحت مجرد مكتبة فيديو وصور مولدة بسرعة، فلن يكون لديها حاجز تنافسي قوي.

أفضل صياغة لميزة مجرة

مجرة منصة عربية عالمية تحول وقت الشاشة إلى رحلة آمنة من القصص والكرتون والألعاب والتعلم، وتساعد الطفل المسلم والعربي على اكتشاف العالم مع الحفاظ على لغته وقيمه.

والميزة التجارية الأقوى في جملة واحدة:

Lingokids للتعلم العام + Miraj للهوية الإسلامية + مكتبة قصص وكوميكس عربية، داخل تجربة واحدة وبسعر أقل.

هذه ليست دعوى تسويقية للاستخدام العلني بأسماء المنافسين، لكنها توضح مكانك الاستراتيجي داخليًا.

