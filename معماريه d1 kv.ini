Phase 5 — Scale وAnalytics

- Versioned home feeds.
- D1 Read Replication + Sessions API.
- Analytics export إلى R2.
- Projections وشاردات فقط عند القياس.
- فصل Workers حسب الحاجة الفعلية.

============================================================
24. اختبارات التحقق المطلوبة قبل الإنتاج
============================================================

الأمان والسلوك:

- بريد واحد لا ينشئ حسابين عند race.
- لا Login قبل email verification.
- Password errors عامة ولا تكشف وجود البريد.
- Refresh rotation وإعادة الاستخدام تبطل الجلسة.
- parentId من Token/IdentityDO لا من Body العميل.
- Child ownership مفروضة داخل FamilyDO.
- Limits 1/4/8 و1/2/4 ذرية تحت التزامن.
- Family/Family Plus content tiers لا تُتجاوز.
- Google Play token لا يرفع الخطة قبل verification.
- Refund/revocation تخفض entitlement بأمان.
- Outbox لا يفقد حدثًا عند فشل Queue.
- Consumer المكرر لا يكرر الأثر.
- لا URL/Token/Password/Purchase token في Logs.

Media:

- R2 غير عامة.
- Token منتهي أو معدل يرفض.
- Asset/version mismatch يرفض.
- Range يعمل بلا D1/DO query.
- Cache لا يتجاوز authorization.
- لا r2.dev في الإنتاج.
- لا Offline video في مرحلة الحماية غير DRM.

الأحمال — على Staging فقط وبعد تصريح منفصل:

- 1,000 مستخدم متزامن.
- 10,000 مستخدم.
- 50,000 مستخدم.
- 100,000 مستخدم عند جاهزية البيئة والتكلفة.

سيناريو مبدئي:

- 70% Home/Catalog cached.
- 10% Search.
- 10% Playback sessions.
- 8% Progress sync.
- 2% Favorites/settings.

معايير قبول أولية:

- API p95 أقل من 200ms.
- API p99 أقل من 500ms.
- Error rate أقل من 0.1%.
- D1 overloaded = صفر في المسار المقاس.
- Queue backlog أقل من 60 ثانية.
- Catalog cache hit ratio أعلى من 90%.
- فقد Billing events = صفر.
- Duplicate events آمنة.
- Media segment D1/DO queries = صفر.

هذه أهداف Staging وليست SLA نهائية حتى تُقاس على التطبيق الفعلي.

============================================================
25. المراقبة والتنبيهات
============================================================

نراقب:

- API latency/error by route/version.
- IdentityDO lockouts دون تسجيل البريد الخام.
- FamilyDO request latency/storage/alarm failures.
- Outbox pending age/count.
- Queue backlog/retries/DLQ depth.
- D1 rows read/written/query latency/overloaded.
- Cache hit ratio.
- R2 errors وMedia 401/403/416/5xx.
- Playback session create/renew/end.
- Billing verification/replay/revocation.

تنبيهات حرجة:

- Billing DLQ > 0.
- أقدم Outbox event يتجاوز الحد.
- Queue backlog مستمر > 60 ثانية.
- ارتفاع unauthorized media غير المعتاد.
- D1 overloaded مستمر.
- FamilyDO SQLITE_FULL أو نمو غير طبيعي.
- توقيع media key غير معروف أو فشل rotation.

لا تحتوي telemetry على PII طفل أو Tokens أو signed URLs كاملة.

============================================================
26. قرارات ما زالت تحتاج اعتمادًا
============================================================

تم اعتماد:

- Custom Parent Authentication.
- Google Play Billing للاشتراكات داخل Android.
- R2 access protection بلا اشتراك DRM في المرحلة الأولى للمحتوى المملوك.
- FamilyDO مصدر الحقيقة لحالة الأسرة.
- IdentityDO لهوية البريد.

ما زال يحتاج قرارًا أو إعدادًا:

- مزود Transactional Email.
- Product IDs النهائية لـFamily وFamily Plus.
- Google Play service account والصلاحيات.
- سياسة Data Residency/Jurisdiction.
- مدة Access/Refresh/Playback tokens النهائية.
- سياسات PIN/biometric وإدارة الأجهزة.
- مشغل الفيديو وطريقة Authorization للـHLS على Android/iOS/TV.
- سياسة Retention للأحداث والتقارير.
- بوابات الدفع المصرية المستقبلية والقنوات المسموحة.

============================================================
27. بوابة أي تنفيذ على Cloudflare
============================================================

هذه الخطة لا تعني الموافقة على النشر.

قبل أي عملية تنشئ أو تعدل موردًا أو تطبق migration أو secret أو deploy يجب عرض:

- حساب Cloudflare والخدمة.
- البيئة: Staging أو Production.
- الأمر الدقيق.
- Durable Object/Queue/D1/R2/KV bindings المتأثرة.
- التكلفة والتعرض العام والبيانات المتأثرة.
- خطة التحقق.
- خطة Rollback وما قد لا يكون قابلًا للعكس.

ثم ننتظر موافقة صريحة مستقلة.

============================================================
28. الخلاصة
============================================================

المعمارية النهائية لمجرة:

IdentityDO = البريد والهوية والقفل
FamilyDO = الأطفال والجلسات والأجهزة والتقدم والاستحقاقات والتزامن
Catalog D1 = الكتالوج وCMS والحقوق والـmetadata
Billing Audit = حقيقة التحقق المالي
R2 = المحتوى والأرشيف
Queues + Outbox = أحداث موثوقة وقابلة للتكرار
Cache/CDN = القراءات العامة والوسائط
KV = Configuration قليلة التغيير فقط
Analytics Engine = قياسات تشغيلية غير مالية

أهم القواعد غير القابلة للتفاوض:

1. لا Family writes أو Heartbeats في Catalog D1.
2. لا Sessions أو Entitlements أو Rate limits ذرية في KV.
3. لا Event مهم من DO إلى Queue دون Transactional Outbox.
4. لا D1 أو FamilyDO query لكل Media Range/HLS segment.
5. لا يختار العميل plan أو entitlement.
6. لا نسمّي حماية R2 الحالية DRM.
7. لا ننشر migrations 0006/0007 البعيدة كتصميم نهائي قبل Cutover إلى Objects.
8. لا إنشاء موارد أو Load Testing أو Deploy دون موافقة صريحة.

