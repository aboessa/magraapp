خطة معمارية Cloudflare القابلة للتوسع لتطبيق «مجرة»
الإصدار: 2.0
التاريخ: 6 أغسطس 2026
الحالة: قرار معماري تنفيذي — لا يجيز إنشاء موارد أو migrations بعيدة أو نشرًا دون موافقة صريحة منفصلة.

============================================================
1. القرار المعماري النهائي
============================================================

لا تكون D1 قاعدة الكتابة الأساسية لكل نشاط المستخدمين.

التقسيم المعتمد:

- Identity Durable Object: هوية ولي الأمر وتسجيل الدخول قبل معرفة parentId.
- Family Durable Object: مصدر الحقيقة لحالة كل أسرة المتغيرة.
- Catalog D1: الكتالوج وCMS والحقوق والعلاقات والـRead Models العامة.
- R2: الفيديو والصور والصوت والحزم والأرشيف.
- Queues: نقل الأحداث والأعمال غير المتزامنة مع DLQ وIdempotency.
- Cache API/CDN: الكتالوج والصفحة الرئيسية والملفات القابلة للتخزين المؤقت.
- KV: إعدادات عامة قليلة التغيير ومؤشرات Cache فقط.
- Analytics Engine: قياسات تشغيلية قصيرة المدى، وليس سجلًا ماليًا.
- Billing Audit: سجل دائم لنتائج التحقق من Google Play وبوابات الدفع المستقبلية.

المبدأ الأساسي:

D1 = بيانات عالمية وقراءات علائقية
IdentityDO = هوية واحدة لكل بريد
FamilyDO = حالة أسرة واحدة وكتابتها الذرية
R2 = ملفات ووسائط وأرشيف
Queues = تسليم أحداث At-least-once
Cache = إبعاد القراءات العامة عن D1
Analytics = قياسات غير مالية

============================================================
2. لماذا لا نستخدم D1 واحدة لكل شيء؟
============================================================

كل قاعدة D1 منفردة تعالج الاستعلامات بالتتابع. الحساب النظري 1ms ≈ 1,000 استعلام/ثانية أو 100ms ≈ 10 استعلامات/ثانية يفيد في فهم المشكلة، لكنه ليس Benchmark أو ضمان أداء؛ زمن الشبكة والاستعلامات والفهارس والتزاحم يغيّر النتيجة.

لا نضع في قاعدة D1 مركزية واحدة:

- كل الحسابات وكلمات المرور.
- كل الأطفال والإعدادات.
- كل الأجهزة والجلسات.
- تقدم المشاهدة لكل المستخدمين.
- التشغيلات المتزامنة.
- Heartbeats.
- المفضلة والمكتبة.
- كل الاشتراكات.
- Analytics الخام.
- الكتالوج وCMS مع كل ما سبق.

الهدف ليس فقط تجنب حد 10GB، بل إزالة طابور كتابة عالمي واحد قبل أن يصبح عنق زجاجة.

حدود D1 المدفوعة الحالية المهمة:

- 10GB لكل قاعدة.
- 1TB إجماليًا للحساب افتراضيًا.
- 50,000 قاعدة افتراضيًا.
- قرابة 5,000 D1 binding لكل Worker.
- Read Replication توسع القراءات، لكن الكتابات تظل تتجه إلى Primary.

المصدر الرسمي:
https://developers.cloudflare.com/d1/platform/limits/

