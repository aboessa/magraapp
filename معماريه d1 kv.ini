============================================================
5. Identity Durable Object
============================================================

سبب وجوده:

عند تسجيل الدخول نعرف البريد، لكن لا نعرف parentId بعد؛ لذلك FamilyDO(parentId) وحده لا يكفي لتسجيل الدخول.

تحديد الـObject:

normalizedEmail = trim(email).toLowerCase()
identityName = sha256(normalizedEmail)
identity = env.IDENTITY_STATE.getByName(identityName)

لا نستخدم البريد الخام كاسم Object لتقليل ظهور PII في السجلات أو أدوات التشغيل.

البيانات داخل IdentityDO:

- normalized_email.
- parent_id.
- password_hash وخوارزمية/نسخة الـKDF.
- email_verified_at.
- failed_login_count.
- locked_until.
- auth_epoch أو identity_version.
- pending_email_change.
- created_at وupdated_at.
- idempotency_keys لعمليات التسجيل والتغيير.

التسجيل:

1. API يتحقق من صيغة البريد وسياسة كلمة المرور.
2. يستدعي IdentityDO الحتمي للبريد.
3. Object واحد فقط يستطيع حجز البريد، وبذلك نفرض uniqueness ذريًا.
4. ينشئ parentId عشوائيًا غير قابل للتخمين.
5. يسجل حجز الهوية وحالة التحقق داخل IdentityDO فقط.
6. يرسل تحقق البريد عبر مزود Transactional Email.
7. لا يسمح بتسجيل الدخول الكامل قبل التحقق.
8. FamilyDO تُنشأ Lazy وبصورة Idempotent عند أول دخول موثّق؛ بذلك لا نحتاج Dual Write بين IdentityDO وFamilyDO أثناء التسجيل.

تسجيل الدخول:

1. IP abuse controls عبر Cloudflare Rate Limiting/WAF.
2. Account attempts والقفل داخل IdentityDO بصورة ذرية.
3. بعد نجاح كلمة المرور يعيد IdentityDO parentId وauth_epoch داخليًا فقط.
4. API يستدعي FamilyDO(parentId) لتسجيل الجهاز وإنشاء session.
5. يصدر Access Token قصير وRefresh Token قابلًا للدوران.

تغيير البريد عملية متعددة المراحل:

- حجز IdentityDO للبريد الجديد.
- إرسال وإثبات التحقق.
- نقل الربط إلى parentId.
- وضع Tombstone آمن على البريد القديم.
- لا يتم Dual Write عشوائي بين Objectين.

لا تستخدم KV في:

- Password hashes.
- محاولات الدخول.
- Account lock.
- Email verification state.
- Sessions.

============================================================
6. Family Durable Object
============================================================

كل أسرة لها Object حتمي:

family = env.FAMILY_STATE.getByName(parentId)

لا نحتاج Directory D1 لمعرفة مكان الأسرة.

جداول SQLite المقترحة داخل FamilyDO:

- schema_meta.
- family_profile.
- children.
- parental_settings.
- devices.
- auth_sessions.
- used_refresh_tokens.
- content_progress.
- favorites.
- downloads.
- offline_licenses.
- entitlements.
- playback_leases.
- recent_activity_summary.
- idempotency_keys.
- outbox.

لا نخزن داخله:

- الفيديو أو الصور أو الصوت.
- سجل كل ثانية مشاهدة.
- Analytics خام غير محدود.
- Logs ضخمة.
- تاريخ مشاهدة كامل بلا Retention.
- Purchase tokens خامًا.

لماذا يتوسع؟

parent_1 → FamilyDO_1
parent_2 → FamilyDO_2
parent_3 → FamilyDO_3

كل Object منفرد Single-threaded ويوفر تنسيقًا وكتابة ذرية لأسرة واحدة، بينما الأسر المختلفة تعمل بالتوازي.

حدود SQLite-backed Durable Objects الحالية:

- عدد Objects غير محدود داخل Namespace على Workers Paid.
- 10GB لكل Object.
- تخزين إجمالي غير محدود على Workers Paid وفق الحدود الحالية.
- حد مرن يقارب 1,000 طلب/ثانية لكل Object منفرد.

أسرة واحدة لا يفترض أن تقترب من هذا المعدل. نضع Retention وحدودًا للتاريخ حتى لا يقترب أي FamilyDO من 10GB.

المصدر الرسمي:
https://developers.cloudflare.com/durable-objects/platform/limits/

============================================================
7. حدود الباقات داخل FamilyDO
============================================================

الباقة         الأطفال   الأجهزة   التشغيل المتزامن   أجهزة التنزيل
-------------------------------------------------------------------
Free              1         1             1                 0
Family            4         4             2                 2
Family Plus       4         8             4                 4

القواعد:

- جميع الحدود تطبق داخل FamilyDO بصورة ذرية.
- لا نعتمد على إخفاء زر في Flutter.
- TV يحتسب جهازًا.
- Cast/AirPlay من جهاز مسجل يحتسب تشغيلًا واحدًا حسب سياسة المنتج.
- لا يحذف النظام أقدم جهاز تلقائيًا؛ ولي الأمر يختار جهازًا لإلغائه خلف PIN/biometric.
- downgrade يستخدم Grace Period ولا يحذف البيانات تلقائيًا.
- policy_version تحفظ مع الاستحقاق والقرارات المهمة.

============================================================
8. Transactional Outbox — إلزامي
============================================================

ممنوع الاعتماد على:

Update FamilyDO
ثم queue.send()

فلو نجح التحديث وفشل الإرسال تضيع الرسالة.

التنفيذ الصحيح:

داخل transaction واحدة في FamilyDO:

1. تحديث الحالة الأساسية.
2. INSERT event في outbox.
3. eventId فريد.
4. تسجيل event type وschema version وoccurredAt وpayload محدود.

بعد Commit:

DO Alarm/flushOutbox
        │
        ▼
Queue.sendBatch
        │
        ▼
Consumer Idempotent
        │
        ▼
ACK ثم تعليم Outbox بأنها أُرسلت أو حذفها حسب Retention

خصائص التسليم:

- Queues تعمل At-least-once؛ التكرار متوقع.
- كل Consumer يستخدم eventId لمنع الأثر المكرر.
- Billing events لا تضيع ولا تعتمد على Queue كأرشيف وحيد.
- Billing Verification تستخدم Transactional Outbox خاصة بها داخل Billing Audit D1 أو Cloudflare Workflow موثوقًا؛ لا ننفذ كتابة Audit ثم queue.send بلا ضمان استكمال.
- Queue ليست Event Store دائمًا؛ الاحتفاظ يصل إلى 14 يومًا فقط.
- Outbox القديمة تُنظف بعد تأكيد الإرسال وفترة تدقيق محددة.
- عمليات حذف/تصدير حساب الأسرة وتغيير البريد تُنفذ كـSaga/Workflow Idempotent عبر حدود الـObjects، مع حالات قابلة للاستكمال بدل محاولة transaction موزعة.

============================================================
9. تحديث تقدم المشاهدة
============================================================

التقدم الفعلي يذهب إلى FamilyDO:

- عند بدء التشغيل.
- كل 30–60 ثانية، مع jitter لتجنب موجة متزامنة.
- عند Pause.
- عند الخروج.
- عند انتهاء الحلقة.
- عند الانتقال بين الأجهزة.

مثال:

{
  "eventId": "uuid",
  "contentId": "episode_123",
  "positionMs": 684000,
  "durationMs": 1200000,
  "deviceId": "device_456",
  "clientUpdatedAt": 1785960000,
  "sequence": 17
}

قواعد التحديث:

- eventId وsequence يمنعان التكرار والرجوع إلى موضع أقدم.
- وقت السيرفر هو المرجع للانتهاء والسياسات، لا ساعة الجهاز وحدها.
- FamilyDO يحدث آخر موضع صالح فورًا.
- حدث مختصر يضاف إلى Outbox للتحليلات والـprojections.

أحداث التحليلات فقط:

- started.
- 25%.
- 50%.
- 75%.
- 90%.
- completed.
- buffering.
- playback_failed.
- subtitle_changed.
- language_changed.

عند 100 ألف مشاهد وتحديث كل دقيقة، المتوسط يقارب 1,667 تحديثًا/ثانية، لكنها موزعة على عشرات الآلاف من Family Objects وليست D1 واحدة.

============================================================
10. Queues وDead Letter Queues
============================================================

نبدأ بعدد قليل حسب درجة الخطورة، لا بـ16 Shard من اليوم الأول:

1. family-events
   - progress projections.
   - parent reports.
   - recommendation signals.
   - DLQ: family-events-dlq.

2. billing-events
   - Google Play verification outcomes.
   - renewals/cancellations/grace/revocations.
   - DLQ مستقلة.
   - فقد حدث غير مقبول.

3. analytics-events
   - playback metrics.
   - export إلى Analytics Engine وR2.
   - DLQ حسب سياسة الاحتفاظ.

4. notification-events
   - تضاف عند تفعيل البريد وPush.

5. content-processing
   - تضاف عند بدء معالجة الوسائط والصور والحزم.

حدود Queue الحالية:

- 5,000 رسالة/ثانية لكل Queue.
- Batch حتى 100 رسالة.
- 250 Push Consumer invocation متزامنًا.
- Backlog حتى 25GB لكل Queue.
- Retention حتى 14 يومًا.

نضيف Hash shards مثل progress-00..15 فقط عند قياس sustained throughput أو backlog يبررها، وليس احتياطًا مبكرًا.

المصدر الرسمي:
https://developers.cloudflare.com/queues/platform/limits/

============================================================
11. Catalog D1 وRead Replication
============================================================

Catalog D1 تحتوي:

- planets/categories.
- series/seasons/episodes.
- stories/books/games/projects.
- languages/localizations.
- content_assets وasset_links.
- content rights والبلدان وتواريخ الانتهاء.
- CMS lifecycle والمراجعات.
- metadata المنشورة.

خصائصها:

- Read-heavy.
- الكتابات تأتي أساسًا من لوحة الإدارة والنشر.
- لا تستقبل Heartbeats أو Progress أو Media segment requests.
- تبدأ قاعدة واحدة للمحافظة على joins والمعاملات البسيطة.

Read Replication:

- تفعل لاحقًا للقاعدة المنشورة بعد الموافقة.
- يجب استخدام D1 Sessions API وإرجاع/استقبال Bookmarks عند الحاجة إلى sequential consistency.
- بدون withSession ستظل الاستعلامات على Primary حتى لو كانت النسخ مفعلة.
- التنفيذ الحالي queryAll/queryFirst لا يستخدم D1 Sessions بعد، ولذلك لا ندعي حاليًا الاستفادة من Read Replication.

المصدر الرسمي:
https://developers.cloudflare.com/d1/best-practices/read-replication/

============================================================
12. D1 Sharding للـProjections فقط
============================================================

FamilyDO يزيل الحاجة إلى D1 sharding لحالة الأسر، لكن قد نحتاجه لـ:

- فهرس حسابات الدعم.
- تقارير مجمعة.
- Searchable projections.
- بيانات المؤسسات والمدارس.
- قوائم إدارية حسب الدولة أو الباقة.

نصمم 4,096 Virtual Partitions:

virtualShard = hash(parentId) % 4096

لكن لا ننشئ 32 قاعدة منذ البداية.

البداية:

- Projection D1 واحدة أو عدد قليل.
- خريطة versioned تربط Virtual Partitions بالقواعد الفعلية.
- عند الضغط ننقل ranges إلى قاعدة جديدة.
- Consumers تستخدم idempotent upserts.
- Projections قابلة لإعادة البناء من الأحداث الدائمة/الملخصات، وليست مصدر الحقيقة.

مؤشرات التوسع:

المؤشر                         التحذير                 الإجراء
--------------------------------------------------------------------------
حجم D1                         50%                     مراجعة النمو
حجم D1                         60%                     تجهيز قاعدة جديدة
حجم D1                         70%                     وقف إسناد بيانات جديدة
p95 مدة الكتابة                ارتفاع مستمر            تقسيم الحمل/تحسين الاستعلام
أخطاء overloaded               أي ارتفاع مستمر         تدخل فوري
Queue backlog                  أكثر من 60 ثانية         زيادة Consumers أو التقسيم
Full table scan متكرر          أي ظهور                 Index أو إعادة تصميم

الأرقام التشغيلية النهائية تضبط من Staging Metrics، وليست ضمانات ثابتة.

============================================================
13. استخدام KV الصحيح
============================================================

KV مناسبة لـ:

- Feature flags.
- Public configuration.
- إعدادات الدول قليلة التغيير.
- Maintenance mode.
- A/B experiment configuration غير الحساسة.
- CMS/feed current version pointer.
- Cache namespace version.
- نسخة Cached غير موثوقة من Shard Map مع مصدر حقيقة أقوى.

KV غير مناسبة لـ:

- Passwords.
- محاولات الدخول الذرية.
- Sessions أو refresh tokens.
- الاشتراك الحالي.
- عدد الأجهزة.
- التشغيل المتزامن.
- Progress.
- الدفع.
- Offline licenses.
- أي قرار يحتاج strong consistency.

السبب:

- كتابة واحدة فقط في الثانية للمفتاح نفسه.
- البيانات Eventually Consistent وقد تظهر قديمة عالميًا.
- get ثم put ليست عملية ذرية.

binding الحالي باسم SESSIONS في Prototype لا يمثل التصميم النهائي. يعاد تسميته أو حصره في non-critical configuration/cache، ولا يستخدم كمخزن جلسات.

المصدر الرسمي:
https://developers.cloudflare.com/kv/platform/limits/

============================================================
14. Cache والصفحة الرئيسية
============================================================

لا نبني Home من D1 لكل طفل.

CMS publish
     │
     ▼
Feed Builder
     │
     ▼
R2 immutable JSON + Cache

أمثلة:

/home/ar/eg/preschool/free/v42.json
/home/ar/sa/kids/family/v42.json
/home/ar/eg/junior/family_plus/v42.json

التقسيم:

- 80–90% من Home عامة ومخزنة في Cache.
- 10–20% شخصية من FamilyDO.

الأقسام الشخصية:

- استمر من حيث توقفت.
- مختار لك.
- رحلة الطفل.
- التنزيلات.
- سلاسل يتابعها.

سياسات Cache:

- النسخ versioned تكون immutable ويمكن تخزينها طويلًا.
- pointer إلى النسخة الحالية قصير الصلاحية ويتحمل KV eventual consistency.
- unpublished/draft لا تدخل public cache.
- cache key تشمل اللغة والدولة والفئة العمرية والباقة والإصدار.
- لا نخلط Responses خاصة أو Authorization states داخل public cache.

============================================================
15. الاشتراكات وGoogle Play
============================================================

للمحتوى الرقمي داخل تطبيق Android نستخدم Google Play Billing، وليس Google Pay كزر دفع مباشر خارج نظام المتجر.

تدفق الشراء:

Flutter Google Play Billing
       │
       ▼
Purchase token إلى Billing Verification Worker عبر جلسة موثقة
       │
       ▼
Google Play Developer API verification
       │
       ├── رفض pending/invalid/revoked
       ├── حفظ hash للتوكن، لا التوكن الخام
       ├── كتابة Billing Audit Idempotent
       └── Command/Event إلى FamilyDO
                          │
                          ▼
                 تحديث entitlement

قواعد:

- العميل لا يرسل plan موثوقًا.
- Product ID → plan mapping خادمية وموقعة بالإصدار.
- كل purchase token يستخدم Idempotency key/hash.
- نتحقق من package name وproduct ID وحالة الشراء والانتهاء والacknowledgement والبيانات المطلوبة من API.
- التجديد والإلغاء وGrace Period وAccount Hold وRefund/Revocation تحدث entitlement.
- Google Play RTDN/Google Pub/Sub يحتاج تحققًا من المصدر ثم إعادة تحقق من Developer API؛ الإشعار وحده ليس قرارًا ماليًا.
- بوابات الدفع المصرية المستقبلية تضاف كـprovider مستقل للويب/القنوات المسموحة، ولا تتجاوز سياسات متجر Android للمحتوى الرقمي.

مصدر الوصول السريع هو FamilyDO entitlement، ومصدر حقيقة الشراء هو المزود مع Billing Audit دائم.

============================================================
16. Playback Control Plane
============================================================

POST /api/v1/episodes/:id/playback-sessions
Authorization: Bearer <access-token>

الخطوات:

1. تحقق Access Token وauth_epoch.
2. تحديد FamilyDO من parentId.
3. تحقق أن الطفل تابع للأسرة ومفعّل.
4. تحقق العمر والمسار.
5. تحقق entitlement وprice tier.
6. تحقق الدولة وحقوق المحتوى من Catalog metadata/cache.
7. تحقق الجهاز وحد التشغيل المتزامن داخل FamilyDO.
8. إنشاء playback lease قصيرة داخل FamilyDO.
9. إصدار capability token موقعة وقصيرة.

محتوى capability المقترح:

- token type/version.
- parent/session/lease identifiers بصيغة pseudonymous.
- asset id وcontent version.
- bucket/object capability أو معرف يمكن حله بلا D1 لكل طلب.
- allowed operation: stream.
- issued_at وexpires_at.
- key id للتدوير.

لا تحتوي:

- R2 credentials.
- كلمات مرور.
- Purchase token.
- PII طفل.

============================================================
17. Media Plane وحماية R2 بلا DRM مدفوع
============================================================

التصميم النهائي:

Player
  │
  ▼
Custom Domain موجّه إلى Media Worker
  │
  ├── تحقق signature وexp محليًا
  ├── تحقق asset/version/operation
  ├── Cache lookup آمن بعد authorization
  └── R2 get/range عبر binding خاص

لا نفعّل Public Bucket أو R2 custom domain مباشرًا يتجاوز Media Worker. إذا اختير مستقبلًا وصول R2 مباشر عبر Custom Domain، يحتاج Access/WAF Token policy مستقلة ومراجعة تهديدات؛ المسار المفضل لمجرة هو Worker أمام Bucket خاص.

ممنوع:

- D1 query لكل Range.
- FamilyDO call لكل HLS segment.
- رابط R2 عام دائم.
- r2.dev في الإنتاج.
- R2 credentials داخل Flutter.
- تسجيل Token كامل في Logs/Analytics.

المدة المقترحة:

- Capability token: 2–5 دقائق.
- Playback lease: 10–20 دقيقة مع heartbeat/renewal منخفض التكرار.
- التجديد يعود إلى Control Plane، لا كل segment.

Cache آمن:

- Worker يتحقق من capability قبل إرجاع أي محتوى.
- بعد التحقق يمكن استخدام cache key مبني على asset/version، وليس token أو parentId، إذا كان المحتوى نفسه لكل المستحقين.
- نركز الـCDN Cache على HLS segments والملفات immutable ذات استجابة 200؛ دعم Cache لطلبات Range/206 يجب إثباته عمليًا ولا يُفترض تلقائيًا.
- لا نعيد Response من public cache قبل authorization.
- لا نخزن Manifest شخصيًا بطريقة تخلط مستخدمين أو خططًا.

اختيار بروتوكول التشغيل:

- MVP الأصلي منخفض المخاطر يمكن أن يبدأ MP4 private مع Range عبر Media Worker.
- للتوسع والجودة ننتقل إلى HLS بجودات متعددة.
- نثبت في Prototype للهاتف/TV طريقة تمرير Authorization لكل manifest/segment؛ إن لم يدعم المشغل headers بأمان، نستخدم signed URL/cookie قصيرة مع Redaction كاملة من logs.

حدود الحماية:

هذه Access Control قوية وليست DRM. لا تمنع مستخدمًا مخولًا من استخراج المحتوى أو تسجيل الشاشة بنسبة 100%. تستخدم فقط للمحتوى الأصلي الذي نملكه أو الذي يسمح عقده بذلك. المحتوى المرخص عالي القيمة قد يحتاج Widevine/FairPlay/PlayReady لاحقًا.

R2 توفر حاليًا:

- مساحة غير محدودة لكل Bucket.
- عدد Objects غير محدود.
- Object يصل إلى قرابة 5TiB.
- r2.dev للاختبار لا الإنتاج؛ Custom Domain هو مسار الإنتاج عند الحاجة.

المصدر الرسمي:
https://developers.cloudflare.com/r2/platform/limits/

============================================================
18. Analytics والأرشيف
============================================================

Analytics Engine تستخدم في:

- Playback errors.
- Buffer ratio.
- Views وCompletion rate.
- Device/platform/app version.
- Country على مستوى مناسب للخصوصية.
- Cache hit/miss.
- API latency.

لا تستخدم كسجل وحيد لـ:

- الدفع.
- الاشتراك.
- حقوق المستخدم.
- حذف/تصدير بيانات الأسرة.

التخزين الطويل:

Events/Outbox
      │
      ▼
Analytics Queue
      │
      ├── Analytics Engine
      └── Hourly/Daily files → R2

مسار R2:

analytics/year=2026/month=08/day=06/hour=14/

لاحقًا يمكن ربط الملفات بـDuckDB أو ClickHouse أو BigQuery أو خدمة BI.

يجب تطبيق Retention وPseudonymization وعدم إرسال Tokens أو URLs موقعة أو PII طفل.

============================================================
19. تقسيم Workers
============================================================

لا نبدأ بعشرة Workers دفعة واحدة.

المرحلة الأولى الدنيا:

- API Gateway/Catalog Worker الحالي مؤقتًا.
- IdentityDO class/namespace.
- FamilyDO class/namespace.
- Media Worker محدود الصلاحيات وله R2 binding فقط وما يلزم للتحقق من التوقيع.
- Admin API داخل Worker الحالي أو منفصل حسب سهولة التشغيل.
- Queue consumers بحسب الـQueues المعتمدة.

بعد ثبات العقود والحمل نفصل إلى:

- api-gateway.
- identity-service.
- family-service.
- catalog-service.
- home-feed-service.
- playback-control-service.
- media-delivery-service.
- billing-verification-service.
- events-ingestion-service.
- admin-api.
- queue-consumers.

التواصل الداخلي عبر Service Bindings/RPC، وليس HTTP عام مع مفاتيح مشتركة ما لم توجد ضرورة.

مبادئ الصلاحيات:

- Catalog Worker لا يملك أسرار الدفع.
- Media Worker لا يعدل Catalog أو entitlement.
- Billing Worker لا يقرأ محتوى الأطفال.
- Admin Worker لا يملك refresh sessions للمستخدمين.
- كل Secret بيئي ولا يدخل الكود أو Flutter.

============================================================
20. شكل النظام عند مليون أسرة
============================================================

1,000,000 أسرة
      │
      ├── حتى 1,000,000 Identity Objects بحسب الحسابات/البريد
      ├── 1,000,000 Family Objects
      ├── Catalog D1 صغيرة نسبيًا
      ├── Cached Home Feeds
      ├── Private R2 للوسائط
      ├── Queues للأحداث
      └── Analytics/R2 للأرشيف

عند 100 ألف مستخدم متزامن:

- الصور والفيديو: Cache/Media Worker/R2، بلا D1 لكل segment.
- الصفحة العامة: Cache/R2 feed.
- Login: موزع على Identity Objects مختلفة.
- حالة كل أسرة: FamilyDO منفصل.
- Progress: موزع على آلاف Objects.
- Analytics: Outbox ثم Queue.
- Catalog D1: Cache misses وقراءات catalog فقط.
- CMS writes: عدد قليل من المستخدمين الإداريين.

نقطة Hot واحدة ممكنة فقط داخل أسرة واحدة أو asset شديد الشعبية؛ Cache والـrate limits وسياسة الـObject تمنع انتقالها إلى قاعدة عالمية مشتركة.

============================================================
21. حالة التنفيذ المحلي الحالية والفجوة
============================================================

المنفذ محليًا حاليًا داخل dashboard/api:

- Catalog/CMS على D1.
- Cache عام للكتالوج وإبطال version عبر KV.
- R2 asset upload وإدارة asset links.
- إخفاء روابط الفيديو الأصلية من public endpoints.
- نموذج Parent Auth مخصص.
- جداول محلية للأجهزة والجلسات والاستحقاقات والPlayback leases في migrations 0006/0007.
- Media route خاص يدعم Range لكنه يستعلم D1 لكل طلب.
- Rate limiting أولي يستخدم KV.

هذه طبقة Prototype انتقالية وليست المعمارية النهائية.

التعارضات المطلوب إزالتها قبل الإنتاج:

- parent_credentials في D1 → IdentityDO.
- children_profiles/settings في D1 → FamilyDO.
- account_devices/sessions في D1 → FamilyDO.
- subscription_entitlements المستخدمة للوصول في D1 → FamilyDO projection.
- watch_progress/favorites في D1 → FamilyDO.
- playback_leases في D1 → FamilyDO.
- KV get/put للـlogin limits → IdentityDO + Rate Limiting/WAF.
- D1 query لكل media Range → local capability verification فقط.

قرار مهم:

لا تطبق migrations 0006 و0007 عن بُعد باعتبارهما التصميم النهائي. تم التحقق منهما محليًا فقط، ويمكن الاحتفاظ بهما كمرجع Prototype أو استبدالهما قبل أول نشر للحسابات.

============================================================
22. خطة الانتقال بدون Dual Write
============================================================

لأن الحسابات الجديدة لم تطلق للمستخدمين بعد، نستخدم Cutover نظيفًا ولا نبني ترحيلًا حيًا معقدًا.

الخطوة 1 — فصل العقود محليًا

نعرف Interfaces:

- IdentityStore.
- FamilyState.
- SessionStore.
- EntitlementStore.
- PlaybackLeaseStore.
- EventOutbox.
- CatalogRepository.
- MediaCapabilitySigner/Verifier.

الخطوة 2 — IdentityDO Prototype

- schema SQLite.
- تسجيل/تحقق/دخول/قفل.
- تغيير بريد versioned.
- لا KV للحالة الحساسة.

الخطوة 3 — FamilyDO Prototype

- children/devices/sessions/progress/favorites/settings.
- entitlements/playback leases.
- idempotency_keys/outbox.
- حدود الباقات الذرية.

الخطوة 4 — نقل المسارات

- /auth/register و/login إلى IdentityDO + FamilyDO.
- /auth/refresh وlogout إلى FamilyDO.
- /episodes/:id/progress إلى FamilyDO.
- /playback-sessions إلى FamilyDO.
- device management إلى FamilyDO.

الخطوة 5 — Media Plane

- capability token versioned مع key rotation.
- إزالة D1 من كل Range/segment.
- R2 private.
- Cache keys آمنة.

الخطوة 6 — Outbox وQueues

- Family outbox أولًا.
- family-events + DLQ.
- idempotent consumer.
- billing-events عند إعداد Google Play.

الخطوة 7 — Catalog Read Scale

- Versioned feeds.
- D1 Sessions API.
- تفعيل Read Replication فقط بعد موافقة resource gate.

لا يوجد Dual Write دائم بين FamilyDO وD1. إن احتجنا Projection، تخرج من Outbox/Queue وتكون قابلة لإعادة البناء.

============================================================
23. مراحل التنفيذ المعتمدة
============================================================

Phase 0 — محلي فقط، بلا موارد Cloudflare جديدة

- تثبيت Interfaces وEvent schemas.
- تعريف IDs وIdempotency keys وschema versions.
- IdentityDO وFamilyDO code/schema محليًا.
- Outbox وAlarm logic.
- Capability token contract.
- تحديث وثائق API والثقة والملكية.
- لا Deploy ولا remote migration.

Phase 1 — Staging Foundation بعد موافقة صريحة

أقل موارد مطلوبة:

- IdentityDO namespace.
- FamilyDO namespace.
- family-events Queue.
- family-events DLQ.
- Secrets توقيع منفصلة للبيئة.
- Staging Worker bindings.

Phase 2 — Auth وFamily State

- مزود Transactional Email.
- تسجيل/تحقق/دخول/Refresh/Logout.
- الأجهزة والأطفال والإعدادات.
- Progress والمفضلة.
- إدارة الإبطال وauth_epoch.

Phase 3 — Playback بلا DRM مدفوع

- Media Worker.
- Capability verification بلا D1 per segment.
