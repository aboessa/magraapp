name: majarra
description: "مجرة - تجربة تعليمية ترفيهية عربية سينمائية للعائلة"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  crypto: 3.0.7
  flutter_riverpod: 2.6.1
  go_router: 14.6.2
  http: 1.2.2
  flutter_animate: 4.5.2
  flutter_secure_storage: 9.2.2
  shared_preferences: 2.3.3
  video_player: ^2.9.2
  chewie: ^1.8.3
  intl: 0.20.2
  local_auth: ^2.3.0
  connectivity_plus: ^6.1.0
  path_provider: ^2.1.4
  speech_to_text: ^7.0.0
  share_plus: ^10.1.2
  in_app_purchase: 3.2.3
  in_app_purchase_android: 0.4.0+10
  url_launcher: 6.3.2
  cryptography: ^2.7.0
  # Pinned to the version already resolved in pubspec.lock, so declaring it
  # changes no dependency graph. It was a transitive package used directly by
  # core/env/app_version.dart: the forced-update gate and the X-App-Version
  # header both compared against a hardcoded '0.1.0' and could never be correct.
  package_info_plus: 9.0.1
  flutter_svg: ^2.3.0
  just_audio: ^0.10.6
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  generate: true

  # Readex Pro is bundled rather than fetched at runtime. Previously the app
  # pulled it from fonts.gstatic.com via the google_fonts package, which meant
  # a first launch without connectivity rendered a fallback face, and a
  # children's app made an outbound request to a third-party host on startup.
  #
  # Source: https://github.com/google/fonts/tree/main/ofl/readexpro
  # Version 1.205, SIL Open Font License 1.1 (assets/fonts/OFL.txt).
  # The upstream file is a variable font with HEXP and wght axes; these are
  # static instances generated with fontTools at HEXP=0 and wght=400/500/600/700,
  # which is the same set of weights google_fonts served.
  #
  # The wght axis stops at 700, so FontWeight.w800 and w900 resolve to Bold —
  # exactly as they did before this change.
  fonts:
    - family: Readex Pro
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-Bold.ttf
          weight: 700

  assets:
    - assets/fonts/OFL.txt
    - assets/brand/
    # شاشة الدخول: bundled webp فقط (24–44KB) يرسم فورًا، وCDN WebP عبر
    # `CinematicImage` بعده. الـPNG (317–824KB) والـJPG القديمة أُسقطت: لم
    # تُرفَع إلى R2 ولا مرجع لها في الكود بعد الترحيل.
    - assets/images/landing/login-bg-landscape.webp
    - assets/images/landing/login-bg-mobile.webp
    - assets/images/landing/landing-family-learning-scene.webp
    - assets/images/series/posters/
    - assets/images/series/banners/
    - assets/images/planets/
    - assets/images/games/
    - assets/images/episodes/
    - assets/images/explore/
    - assets/images/seasonal/
    # الكتب: R2 أوّلًا عبر `heavyCdnUrl` (16 webp على
    # `public/catalog/assets/images/books/`)، و`posterAsset` المبندل بديل عدم
    # الاتصال. تُبندل لسبب واحد: كتالوج عدم الاتصال (`local_catalog.dart`)
    # يَعِد بها، والوعد بلا ملفّ كذبٌ على طفل دون شبكة.
    - assets/images/books/
    # Story artwork is API/R2-only. Never bundle story pages, covers, or audio
    # in an APK: this keeps the binary small and ensures readers use the
    # server-authoritative catalogue and access policy.
    - assets/images/drawing/coloring/
    - assets/images/drawing/templates/
    - assets/images/drawing/covers/
    # Creative Studio chrome — R2-first zero-bloat policy:
    # لا نبندل أي رسومات تلوين/وصل/أكمل/تتبع/حروف/أرقام كبيرة في APK.
    # المحتوى (coloring/v2, draw_like_me, connect_dots, landing, books) تحمَّل
    # من R2 THUMBS_BUCKET عبر `heavyCdnUrl` (سكربت `tools/upload_heavy_r2.mjs`:
    # 49.8MB ← 5.5MB بتحويل WebP q82)، ويمرّ عبر `RemoteImageCache`.
    # فقط bird.png كـ placeholder 8KB fallback offline + studio hero webp fallback.
    - assets/images/coloring/bird.png
    # chrome الاستوديو نفسه (hero + أغلفة الأنشطة + أيقونات الاختصارات) يُبندل:
    # بطاقات 8–20KB لكلّ واحدة تُرسم في شبكة الأنشطة فور فتحها — رحلة شبكة لكلّ
    # بطاقة تشتري صفر ميغابايت عمليًّا وتكسر الفتح الفوري دون اتصال.
    # اللافتات الستّ PNG (~1MB) أُسقطت: توأمها WebP على R2
    # (`tools/upload_studio_banners_r2.mjs`)، والـwebp المبندل (33–130KB)
    # يرسم فورًا بينما CDN يأتي عبر `CinematicImage`.
    # إعلان المجلد غير تعاودي في Flutter، فلن يجرّ studio/v2/ إن عاد للظهور.
    - assets/images/studio/card-coloring.webp
    - assets/images/studio/card-complete.webp
    - assets/images/studio/card-connect-dots.webp
    - assets/images/studio/card-copy-pattern.webp
    - assets/images/studio/card-draw-like-me.webp
    - assets/images/studio/card-free-draw.webp
    - assets/images/studio/card-letters.webp
    - assets/images/studio/card-numbers.webp
    - assets/images/studio/card-prompt-draw.webp
    - assets/images/studio/card-trace.webp
    - assets/images/studio/coloring-banner.webp
    - assets/images/studio/connect-dots-banner.webp
    - assets/images/studio/draw-like-me-banner.webp
    - assets/images/studio/studio-main-banner.webp
    - assets/images/studio/homebgaart.webp
    - assets/images/studio/hero-start-drawing.webp
    - assets/images/studio/hero-connect-dots-small.webp
    - assets/images/studio/icon-new-canvas.webp
    - assets/images/studio/icon-draw-like-me.webp
    # الأڤاتارات: R2 أوّلًا، مبندلٌ واحد احتياطي.
    #
    # كلّ أڤاتار في `ChildAvatars.all` يُحمَّل من
    # `{AppConfig.assetBaseUrl}/public/avatars/<sub>/<id>.webp` عبر
    # `RemoteImageCache` (رُفع بـ`tools/upload_avatars_r2.mjs`: ‏25.5MB ‏← 0.9MB
    # بتحويل PNG ‏← WebP q85). `assetPath` في الكود هو بديل عدم الاتصال فقط.
    #
    # المبندل الوحيد `luna-full.png`: هو `_fallback` في `byId(null)` — يظهر لكلّ
    # طفل بلا أڤاتار محفوظ، بما فيه التشغيل الأوّل دون شبكة. إزالته تعني شاشة
    # اختيار طفل بلا أيّ صورة قبل أوّل تحميل.
    #
    # ولا يُعاد إعلان مجلّدٍ أبدًا: إعلان المجلّد جارفٌ وكان يحزم 47.5MB لا
    # يبلغها أيّ سطر في `lib/` (انظر `test/avatar_bundle_test.dart`).
    # عند إضافة أڤاتار جديد: أضف WebP إلى R2 بالسكربت، و`assetPath` هنا فقط إن
    # كان بديل عدم اتصال، ويحرس ذلك `test/avatar_r2_test.dart`.
    - assets/avatars/characters/luna-full.webp
    # Activity metadata remains app chrome. Story reader JSON is deliberately
    # excluded; it is fetched from /api/v1/stories/:id/pages only.
    - assets/data/coloring_pages.json
    - assets/data/coloring_templates.json
    - assets/data/complete_items.json
    - assets/data/copy_items.json
    - assets/data/dots_items.json
    - assets/data/letter_items.json
    - assets/data/number_items.json
    - assets/data/prompt_items.json
    - assets/data/reference_activities.json
    - assets/data/reference_steps.json
    - assets/data/trace_items.json
