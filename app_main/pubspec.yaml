name: majarra
description: "مجرة - تجربة تعليمية ترفيهية عربية سينمائية للعائلة"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  crypto: 3.0.7
  flutter_riverpod: 2.6.1
  go_router: 14.6.2
  http: 1.2.2
  flutter_animate: 4.5.2
  flutter_secure_storage: 9.2.2
  shared_preferences: 2.3.3
  video_player: ^2.9.2
  chewie: ^1.8.3
  hive_flutter: ^1.1.0
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  generate: true

  # Readex Pro is bundled rather than fetched at runtime. Previously the app
  # pulled it from fonts.gstatic.com via the google_fonts package, which meant
  # a first launch without connectivity rendered a fallback face, and a
  # children's app made an outbound request to a third-party host on startup.
  #
  # Source: https://github.com/google/fonts/tree/main/ofl/readexpro
  # Version 1.205, SIL Open Font License 1.1 (assets/fonts/OFL.txt).
  # The upstream file is a variable font with HEXP and wght axes; these are
  # static instances generated with fontTools at HEXP=0 and wght=400/500/600/700,
  # which is the same set of weights google_fonts served.
  #
  # The wght axis stops at 700, so FontWeight.w800 and w900 resolve to Bold —
  # exactly as they did before this change.
  fonts:
    - family: Readex Pro
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-Bold.ttf
          weight: 700

  assets:
    - assets/fonts/OFL.txt
    - assets/brand/
    - assets/images/landing/
    - assets/images/series/posters/
    - assets/images/series/banners/
    - assets/images/planets/
    - assets/images/games/
    - assets/images/episodes/
